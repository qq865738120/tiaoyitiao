interface:
  display_name: "Cocos 2D 精灵资产"
  short_description: "生成可导入 Cocos 3.8 的角色、道具、动作帧、FX 与静态背景。"
  default_prompt: "使用 $2dsprite 生成 Cocos Creator 3.8.x 可导入的静态单 PNG 或 loose-frame 权威资产包；透明角色/道具/动作/FX 按证据选择 raster 或 pixel-art 与 tight/safe，完整静态背景显式使用 background + opaque + raster 并保留完整画布；所有缩放保持宽高比，再通过真实图片 Agent、Game Asset authority 复验、PythonRuntime、分支 QC 与处理后视觉批准完成交付，不写 AssetDB、Scene、Prefab 或 AnimationClip。"

policy:
  allow_implicit_invocation: true
